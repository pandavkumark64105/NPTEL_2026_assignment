<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soft Skills July-Oct 2026 — Mock Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
.app{min-height:100vh;display:flex;justify-content:center;padding:22px}
.card{width:min(900px,100%);background:white;border:1px solid #e5e9f2;border-radius:22px;box-shadow:0 12px 35px rgba(20,30,55,.08);overflow:hidden}
.top{padding:20px 22px 14px;border-bottom:1px solid #edf0f5}
.brand{display:flex;justify-content:space-between;gap:12px;align-items:center}
h1{font-size:21px;margin:0}
.badge{font-size:12px;padding:7px 10px;border-radius:999px;background:#eef3ff}
.progress{height:8px;background:#edf0f5;border-radius:999px;margin-top:16px;overflow:hidden}
.bar{height:100%;width:0;background:#4f6df5;transition:.25s}
.body{padding:26px 22px}
.meta{font-size:13px;color:#65708a;margin-bottom:12px}
.question{font-size:21px;line-height:1.45;font-weight:700;white-space:pre-line;margin-bottom:20px}
.hint{font-size:13px;color:#6b7280;margin:-8px 0 16px}
.options{display:grid;gap:11px}
.option{width:100%;text-align:left;border:1.5px solid #dfe4ee;background:#fff;padding:14px 15px;border-radius:14px;cursor:pointer;font-size:15px;line-height:1.4;transition:.15s}
.option:hover{border-color:#91a2ef;background:#fafbff}
.option.selected{border-color:#4f6df5;background:#eef3ff}
.option.correct{border-color:#28a36a;background:#eaf9f1}
.option.wrong{border-color:#e05b5b;background:#fff0f0}
.option:disabled{cursor:default}
.letter{font-weight:800;margin-right:8px}
.feedback{display:none;margin-top:18px;padding:15px;border-radius:14px;line-height:1.5}
.feedback.show{display:block}
.feedback.ok{background:#eaf9f1;border:1px solid #bce8d0}
.feedback.no{background:#fff0f0;border:1px solid #f1c1c1}
.explain{margin-top:8px;color:#465168;font-size:14px;white-space:pre-line}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:24px;flex-wrap:wrap}
button.action{border:0;border-radius:12px;padding:12px 17px;font-weight:700;cursor:pointer}
.primary{background:#4f6df5;color:white}
.secondary{background:#edf0f5;color:#253047}
.primary:disabled{opacity:.45;cursor:not-allowed}
.result{display:none;padding:30px 22px}
.score{font-size:46px;font-weight:850;margin:8px 0}
.percent{font-size:18px;color:#5b667c}
.review{margin-top:24px;display:grid;gap:9px;max-height:50vh;overflow:auto}
.review-item{padding:12px;border:1px solid #e7ebf2;border-radius:12px}
.review-item strong{display:block;margin-bottom:5px}
.start{padding:34px 22px;text-align:center}
.start h2{margin:0 0 10px}
.start p{color:#667085;line-height:1.55}
.small{font-size:12px;color:#7a8498;margin-top:14px}
@media(max-width:600px){
 .app{padding:8px} .card{border-radius:16px} .body{padding:20px 15px}
 .question{font-size:18px} .actions button{flex:1} h1{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
<div class="card">
  <div class="top">
    <div class="brand">
      <h1>📚 Soft Skills July–Oct 2026</h1>
      <div class="badge" id="counter">Question 1 / 180</div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>

  <div class="start" id="start">
    <h2>Interactive Mock Test</h2>
    <p>180 slide-by-slide questions from the supplied PDF. Questions marked “Select all that apply” allow multiple answers.</p>
    <button class="action primary" onclick="startTest()">Start Test</button>
    <div class="small">Your score is calculated only after checking/submitting your answers.</div>
  </div>

  <div class="body" id="quiz" style="display:none">
    <div class="meta" id="meta"></div>
    <div class="question" id="question"></div>
    <div class="hint" id="hint"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions">
      <button class="action secondary" id="prevBtn" onclick="prevQ()">← Previous</button>
      <button class="action primary" id="checkBtn" onclick="checkAnswer()">Check Answer</button>
      <button class="action primary" id="nextBtn" onclick="nextQ()" style="display:none">Next →</button>
    </div>
  </div>

  <div class="result" id="result">
    <div class="meta">TEST COMPLETE</div>
    <h2>Your Result 🎯</h2>
    <div class="score" id="score"></div>
    <div class="percent" id="percent"></div>
    <div class="actions">
      <button class="action primary" onclick="restart()">🔄 Restart Test</button>
      <button class="action secondary" onclick="toggleReview()">📋 Review Answer Key</button>
    </div>
    <div class="review" id="review" style="display:none"></div>
  </div>
</div>
</div>

<script>
const questions = [{"week": 1, "number": 1, "question": "Hearing is a physiological activity, whereas listening is a _______ one.", "options": ["mental", "physical", "social", "Psychological"], "correct": [0], "explanation": "Hearing is mainly a physical/physiological process involving our ears. Listening is \nan active mental process because we need to concentrate, understand and \ninterpret what someone is saying. Therefore, listening is called a mental activity."}, {"week": 1, "number": 2, "question": "The system of personality that operates on the pleasure principle and represents the \ntrue psychic reality is the _______.", "options": ["ego", "superego", "id", "Creative self"], "correct": [2], "explanation": "According to Freud, the Id works according to the pleasure principle. It wants \nimmediate satisfaction of basic desires and needs without thinking about rules or \nconsequences. For example, if someone is hungry, the Id simply wants food \nimmediately."}, {"week": 1, "number": 3, "question": "In the six thinking hats technique, the hat associated with generating ideas is the \n_______.", "options": ["yellow hat", "green hat", "blue hat", "white hat"], "correct": [1], "explanation": "The Green Hat represents creativity, new ideas and alternatives. When a person \nwears the green hat, they try to think of different possibilities and creative solutions \nrather than simply judging existing ideas."}, {"week": 1, "number": 4, "question": "The word \"personality\" is derived from the Latin word persona, meaning _______.", "options": ["mind", "mask", "mimesis", "personal"], "correct": [1], "explanation": "The word personality comes from the Latin word persona, which means mask. In \nancient times, actors used masks to represent different characters. This idea \nbecame associated with the way a person presents themselves to others."}, {"week": 1, "number": 5, "question": "The shared background of experience between a sender and a receiver, essential for \nsuccessful communication, is called the:", "options": ["common frame of reference", "feedback loop", "communication channel", "grapevine"], "correct": [0], "explanation": "A common frame of reference means that the sender and receiver have some \nshared background or understanding. This helps them understand each other's \nmessage correctly. For example, two students studying the same subject may \nunderstand a technical term more easily because they share similar knowledge."}, {"week": 1, "number": 6, "question": "A recruiter would rather hire a candidate with a pleasant smile and good communication \nskills than one who has:", "options": ["a foreign degree", "a very good CGPA but is doing nothing", "several years of work experience", "strong technical certifications"], "correct": [1], "explanation": "Good academic performance is important, but employers also value communication \nskills, confidence, attitude and active participation. A high CGPA alone may not be \nenough if the person cannot communicate or demonstrate useful skills. This \nquestion highlights the importance of soft skills in employment."}, {"week": 1, "number": 7, "question": "The word \"communication\" derives from the Latin word communicare, which means:", "options": ["To speak", "To share", "To inform", "To persuade"], "correct": [1], "explanation": "The Latin word communicare means to share. Communication is essentially the \nprocess of sharing information, ideas, feelings or thoughts with other people."}, {"week": 1, "number": 8, "question": "\"Grapevine\" in organisational communication refers to:", "options": ["A forward upward channel of communication", "An informal channel that may be rumor-based and not always authentic", "External communication with government agencies", "Communication through company websites and pamphlets"], "correct": [1], "explanation": "The grapevine is an informal communication network in an organisation. Information \nmay spread from one employee to another without following official communication \nchannels. Because it can include rumours or incomplete information, it may not \nalways be accurate."}, {"week": 1, "number": 9, "question": "Approximately what percentage of one's time (in any job) is spent in listening?", "options": ["30-40 percent", "40-50 percent", "60-75 percent", "80-90 percent"], "correct": [2], "explanation": "Listening is a major part of workplace communication. Employees listen to \ninstructions, meetings, discussions, customers, colleagues and managers. \nTherefore, a significant portion of working time is spent listening."}, {"week": 1, "number": 10, "question": "Extracting meaning from a received message (receiver's task) is:", "options": ["Code", "Interpreting", "Encode", "Decode"], "correct": [3], "explanation": "In communication, the sender encodes an idea into words, symbols or signals. The \nreceiver then decodes those words or signals to understand their meaning. \n example: \nIdea → Encode → Message → Decode → Understanding \nSo, extracting meaning from a received message is decoding"}, {"week": 1, "number": 11, "question": "Which of the following are behavioural soft skills? (Select all that apply)", "options": ["Self-awareness", "Technical competence", "Persistence", "Knowledge"], "correct": [0, 2], "explanation": "Self-awareness means understanding your own thoughts, emotions, strengths and \nweaknesses. Persistence means continuing to work toward a goal despite \ndifficulties. Both are behavioural soft skills. Technical competence and knowledge \nare more related to technical/hard skills."}, {"week": 1, "number": 12, "question": "Which of the following are part of the Seven Cs of effective communication? (Select all \nthat apply)", "options": ["Crispness", "Conciseness", "Creativity", "Courtesy"], "correct": [1, 3], "explanation": "Conciseness means communicating your message using only the necessary words \nwithout unnecessary information. Courtesy means communicating politely and \nrespectfully. Both are important principles of effective communication."}, {"week": 1, "number": 13, "question": "According to De Bono's Six Thinking Hats technique, which of the following hat \nfunction pairings are correct? (Select all that apply)", "options": ["White hat—seeing things objectively", "Red hat—generating ideas", "Yellow hat—fighting against and preventing mistakes", "Blue hat—organising and controlling the thought process"], "correct": [0, 3], "explanation": "The White Hat focuses on facts, information and an objective view. The Blue Hat \ncontrols and organises the thinking process. The Red Hat deals mainly with \nemotions and feelings, while the Green Hat is associated with generating ideas."}, {"week": 1, "number": 14, "question": "Which of the following statements about Freud's theory of personality are correct? \n(Select all that apply)", "options": ["The Id operates through the Reality Principle", "The Ego is the executive of the personality and organised portion of the Id", "The Superego strives for perfection rather than pleasure", "The Superego opposes only the Id, but supports the Ego"], "correct": [1, 2], "explanation": "The Ego is described as the executive or organised part of personality and deals \nwith reality. The Superego represents ideals and morality and strives for perfection \nrather than simply seeking pleasure."}, {"week": 1, "number": 15, "question": "Match the concept with correct thinker/source: \n \nColumn A       Column B \nP. \"Truth springs from argument amongst friends\"  1. Swami Vivekananda \nQ. \"Arise, awake, and stop not till the goal is reached\" 2. Alfred Adler \nR. Fictional Finalism & Striving for Superiority  3. David Hume \n\n  \nS. Id, Ego and Superego     4. Sigmund Freud", "options": ["P-3, Q-1, R-2, S-4", "P-1, Q-3, R-4, S-2", "P-3, Q-1, R-4, S-2", "P-2, Q-1, R-3, S-4"], "correct": [0], "explanation": "Answer follows the source material's question/option mapping."}, {"week": 2, "number": 1, "question": "In the glass-of-water example, a person who says the glass is \"half empty\" is described \nas:", "options": ["An optimist", "A pessimist", "An introvert", "An extrovert"], "correct": [1], "explanation": "A pessimist generally focuses on the negative side of a situation. When a person \nsees a glass as \"half empty,\" they focus on the empty portion. An optimist, in \n\n  \ncontrast, would usually focus on the positive side and say that the glass is \"half full.\""}, {"week": 2, "number": 2, "question": "According to Dr. Eric Berne, the attitude \"I'm okay, you are okay\" represents a person \nwho is:", "options": ["Imposing", "Negative", "Positive and cooperative", "Introverted"], "correct": [2], "explanation": "\"I'm okay, you are okay\" means that a person has a positive view of themselves as \nwell as other people. Such a person is generally more willing to cooperate, \ncommunicate and maintain healthy relationships. \nmeaning: \nI am valuable + You are valuable = Positive relationship."}, {"week": 2, "number": 3, "question": "According to Mehrabian, the percentage of communication that is verbal is:", "options": ["7%", "35%", "38%", "55%"], "correct": [0], "explanation": "According to the Mehrabian model referenced in this assignment, verbal \ncommunication accounts for 7%. The remaining percentages in the model are \nassociated with other aspects of communication, particularly voice and non-verbal \ncues."}, {"week": 2, "number": 4, "question": "Which voice fault results from the inflammation of the larynx and usually needs a speech \ntherapist?", "options": ["Throatiness", "Breathiness", "Nasalization", "Hoarseness"], "correct": [3], "explanation": "Hoarseness is a change in the normal quality of the voice, often making it sound \nrough or strained. Inflammation of the larynx (voice box) can cause this problem. \nThe assignment states that it may require help from a speech therapist."}, {"week": 2, "number": 5, "question": "In the Johari Window, the region representing information that is unknown by the person \nbut known by others is the:", "options": ["Open area", "Blind area", "Hidden area", "Unknown area"], "correct": [1], "explanation": "The Blind Area contains information that others know about us but we do not \nrecognize ourselves. For example, other people may notice that you speak very \nquickly, but you may not realize it."}, {"week": 2, "number": 6, "question": "Which of the following is not listed as a feature of telephonic communication?", "options": ["Clarity", "Courtesy", "Brevity", "Confrontation"], "correct": [3], "explanation": "Good telephone communication should involve clarity, courtesy and brevity. We \nshould communicate clearly, politely and without unnecessary conversation. \nConfrontation is not listed as a desirable feature of telephonic communication."}, {"week": 2, "number": 7, "question": "Teleconferencing is generally considered ineffective for which of the following purpose?", "options": ["Connecting geographically dispersed people", "Negotiations", "Arranging meetings at short notice", "Saving travel costs"], "correct": [1], "explanation": "Teleconferencing is useful for connecting people who are far away, arranging \n\n  \nmeetings quickly and reducing travel costs. However, negotiations can be more \ndifficult because they often require close observation of reactions, expressions and \nbody language."}, {"week": 2, "number": 8, "question": "The change in pitch produced by the vibration of the vocal cords is called _______.", "options": ["Intonation", "Articulation", "Inflection", "Modulation"], "correct": [2], "explanation": "Inflection refers to changes in the pitch of the voice while speaking. We naturally \nchange our pitch to express different meanings, emotions or emphasis. \nFor example, your voice may rise when asking a question and change when \nshowing surprise."}, {"week": 2, "number": 9, "question": "Voice mail acts as a substitute to short memos and phone calls and helps solve \n_______ difficulties.", "options": ["Special zone", "Time zone", "Communication zone", "Talk zone"], "correct": [1], "explanation": "People working in different countries may be in different time zones. Voice mail \nallows one person to leave a message that another person can listen to later. \nTherefore, both people do not need to be available at the same time."}, {"week": 2, "number": 10, "question": "Which two of the following are listed as ways to develop positivism? (Select all that \napply)", "options": ["Believe in your abilities", "Imitate others completely", "Concentrate on your goals", "Hide your weaknesses permanently"], "correct": [0, 2], "explanation": "A positive person should have confidence in their abilities and focus on achieving \ntheir goals. Simply copying other people or permanently hiding weaknesses does \nnot develop genuine positivity."}, {"week": 2, "number": 11, "question": "While sending a call, which two of the following guidelines should be followed? (Select \nall that apply)", "options": ["Recline in your chair", "Place your own call", "Plan an agenda", "Avoid identifying yourself"], "correct": [1, 2], "explanation": "When you need to make a professional call, you should make the call yourself \nrather than unnecessarily asking someone else to do it. It is also useful to plan an \nagenda, so you know what you need to discuss and the conversation remains \norganised."}, {"week": 2, "number": 12, "question": "Which two statements about voice mail are correct? (Select all that apply)", "options": ["It provides immediate, specific feedback.", "It acts as a substitute to short memos and phone calls.", "It solves time-zone difficulties.", "It increases interoffice paperwork."], "correct": [1, 2], "explanation": "Voice mail allows a person to leave a message when the receiver is unavailable. It \ncan therefore replace some short messages or phone calls. It is also useful when \npeople are located in different time zones, because they don't have to communicate \nat exactly the same time."}, {"week": 2, "number": 13, "question": "Which of the following points highlight the importance of telephonic communication? \n(Select all that apply)", "options": ["Provides immediate face-to-face feedback", "Allows reading of facial expressions", "Bridges time and distance gaps", "Entails low cost"], "correct": [2, 3], "explanation": "Telephone communication allows people to communicate even when they are far \napart, so it helps overcome distance and time-related communication barriers. It is \nalso generally less expensive than travelling for a face-to-face meeting. \nOptions A and B are incorrect because a telephone call does not provide face-to-\nface interaction or allow us to see facial expressions."}, {"week": 2, "number": 14, "question": "Which two of the following are described as characteristics of voice? (Select all that \napply)", "options": ["Volume", "Grammar", "Pitch", "Vocabulary"], "correct": [0, 2], "explanation": "Volume tells us how loud or soft the voice is. Pitch tells us whether the voice \nsounds relatively high or low. Grammar and vocabulary are related to language, not \ndirectly to the characteristics of the voice itself."}, {"week": 2, "number": 15, "question": "Fists     S. Tension and frustration", "options": ["1-P, 2-R, 3-S, 4-Q", "1-R, 2-P, 3-S, 4-Q", "1-R, 2-S, 3-P, 4-Q", "1-Q, 2-P, 3-R, 4-S"], "correct": [1], "explanation": "Body movements can communicate emotions even without words. Limp/hanging \nhands can indicate lack of interest or boredom, while open hands can suggest \nopenness and trust. Clenched hands can indicate tension or frustration, while fists \ncan express determination or anger."}, {"week": 3, "number": 1, "question": "The term \"proxemics\" is derived from which word?", "options": ["Property", "Proximity", "Procedure", "Proportion"], "correct": [1], "explanation": "The word proxemics comes from proximity, which means closeness or nearness. In \ncommunication, proxemics studies how the distance we maintain from other people \naffects communication."}, {"week": 3, "number": 2, "question": "The word \"haptics\" is taken from a Greek word that means:", "options": ["I see", "I hear", "I touch", "I feel"], "correct": [2], "explanation": "Haptics refers to communication through touch, such as a handshake, pat on the \nback or other appropriate physical contact. The term comes from a Greek word \nassociated with the sense of touching."}, {"week": 3, "number": 3, "question": "The prefix \"meta\" means:", "options": ["Within", "Beyond", "Around", "Without"], "correct": [1], "explanation": "The prefix meta generally means beyond, about itself, or at a higher level. In the \ncontext of communication, metacommunication can refer to communication about \ncommunication itself."}, {"week": 3, "number": 4, "question": "The study of time in communication is called _______.", "options": ["Communemics", "Chronemics", "Kinesics", "Mimesis"], "correct": [1], "explanation": "Chronemics is the study of the use and perception of time in communication. For \nexample, being early, being late, the length of a conversation, or how quickly \nsomeone responds can communicate different meanings."}, {"week": 3, "number": 5, "question": "Hearing is only a _______ activity, whereas listening is a mental activity that requires \nconscious participation.", "options": ["Physiological", "Psychological", "Physical", "Social"], "correct": [0], "explanation": "Hearing happens naturally through the functioning of our ears and auditory system, \nso it is a physiological activity. Listening, however, requires attention, understanding \nand conscious mental effort."}, {"week": 3, "number": 6, "question": "According to the Space Zone in Proxemics, the social zone corresponds to a space \ndistance of:", "options": ["Up to 18 inches", "18 inches to 4 feet", "4 feet to 12 feet", "12 feet to 30 feet"], "correct": [2], "explanation": "The social zone is used when interacting with people in social or professional \nsituations who are not extremely close to us. According to the distance classification \nused in the assignment, this zone extends from 4 feet to 12 feet."}, {"week": 3, "number": 7, "question": "Listening in which the listener keeps protesting mentally instead of taking in the \nmessage is called:", "options": ["Attentive Listening", "Reflective Listening", "Combative Listening", "Appreciative Listening"], "correct": [2], "explanation": "In combative listening, the listener approaches the conversation as if they are in an \nargument. Instead of understanding the speaker's message, they continuously \nprepare objections and mentally disagree with what is being said."}, {"week": 3, "number": 8, "question": "In Thailand and Laos, it is considered rude for a stranger to touch a child on the head \nbecause the head is regarded as:", "options": ["the most fragile part of the body", "the home of the spirit or soul", "a mark of seniority", "reserved only for parents"], "correct": [1], "explanation": "According to the cultural practice described in the assignment, the head is \nconsidered the home of the spirit or soul. Therefore, touching another person's \nhead, especially a child's head, can be viewed as inappropriate or disrespectful."}, {"week": 3, "number": 9, "question": "\"Lying is done with words and also with silence.\" This observation is attributed to:", "options": ["Edward T. Hall", "Ernest Hemingway", "Adrienne Rich", "Albert Mehrabian"], "correct": [2], "explanation": "The statement highlights the importance of silence as a form of communication. \nSometimes what a person deliberately does not say can communicate a message \njust as strongly as spoken words. \n \nCommunication is not only what we say; silence can also communicate."}, {"week": 3, "number": 10, "question": "Which of the following countries are classified as high context cultures? (Select all that \napply)", "options": ["Germany", "Japan", "England", "Arab"], "correct": [1, 3], "explanation": "In high-context cultures, people often rely on shared background, relationships, \nsocial situations and non-verbal signals to understand a message. The assignment \nidentifies Japan and Arab cultures as examples of high-context cultures."}, {"week": 3, "number": 11, "question": "Which of the following are listed as internal factors that affect listening? (Select all that \napply)", "options": ["Noise in the room", "State of mind", "Ego", "Choice of venue"], "correct": [1, 2], "explanation": "Your state of mind can affect how well you concentrate and understand someone. \nYour ego can also interfere—for example, if you think you already know everything, \nyou may not listen properly to another person's ideas."}, {"week": 3, "number": 12, "question": "Which of the following are factors that block or deter proper listening? (Select all that \napply)", "options": ["Patience", "Adequate hearing", "Prejudging", "Ambiguity"], "correct": [2, 3], "explanation": "Prejudging means forming an opinion about the speaker or message before hearing \nthe complete information. Ambiguity means the message is unclear or has more \nthan one possible meaning, making it difficult to understand."}, {"week": 3, "number": 13, "question": "Which two are stated advantages of silence in a speech? (Select all that apply)", "options": ["It relieves the audience", "It increases that speaker's rate of delivery", "It provides thinking time to the speaker", "It removes the need for preparation"], "correct": [0, 2], "explanation": "A pause gives the audience time to absorb and understand what has been said. It \nalso gives the speaker time to think, organise the next point and continue \nconfidently."}, {"week": 3, "number": 14, "question": "Excessive use of non-words and vocalized pauses by a speaker may convey: (Select \nall that apply)", "options": ["Ambiguity or doubt", "Authority", "Lack of preparation", "Command over the subject"], "correct": [0, 2], "explanation": "Too many vocalized pauses can make a speaker appear uncertain or doubtful. \nThey may also suggest that the speaker has not prepared the material well or is \nstruggling to organise their thoughts."}, {"week": 3, "number": 15, "question": "Analytical \nlistening \nS. A leader hears both sides of a dispute before \ndeciding", "options": ["A. 1-P, 2-Q, 3-R, 4-S", "B. 1-Q, 2-P, 3-R, 4-S", "C. 1-Q, 2-P, 3-S, 4-R", "1-R, 2-S, 3-Q, 4-P"], "correct": [1], "explanation": "Answer follows the source material's question/option mapping."}, {"week": 4, "number": 1, "question": "What does the acronym WATNA stand for in negotiation?", "options": ["Worst Alternative to a Negotiated Agreement", "Wise Alternative to a Negotiated Agreement", "Worst Argument to a Negotiated Agreement", "Workable Alternative to a Negotiated Agreement"], "correct": [0], "explanation": "WATNA stands for Worst Alternative to a Negotiated Agreement. It helps a \nnegotiator understand what the worst outcome could be if negotiations fail. Knowing \nthis can help a person decide whether accepting a proposed agreement is better \nthan walking away."}, {"week": 4, "number": 2, "question": "To which former US President is attributed the following line: \"Let us never negotiate out \nof fear, but let us never fear to negotiate\"?", "options": ["Abraham Lincoln", "John F. Kennedy", "Franklin D. Roosevelt", "Woodrow Wilson"], "correct": [1], "explanation": "The statement is attributed to John F. Kennedy. The idea is that people should not \nnegotiate because they are afraid, but they should also not be afraid to negotiate. In \nother words, negotiation should be approached with courage and confidence."}, {"week": 4, "number": 3, "question": "According to Alan Fowler, negotiation is any form of meeting or discussion in which the \nparties use argument and persuasion to arrive at:", "options": ["A unilateral decision favouring the stronger party", "An agreed decision or action", "A legally binding written contract", "A postponement of the conflict"], "correct": [1], "explanation": "Negotiation involves discussion, argument and persuasion between two or more \nparties. The goal is to reach an agreed decision or action rather than simply \nallowing the stronger person to impose a decision."}, {"week": 4, "number": 4, "question": "To which of the following does a real negotiation proceed through?", "options": ["Authority, not instruction", "Instruction and persuasion, not authority and imposition", "Imposition backed by seniority", "Silence and withdrawal"], "correct": [1], "explanation": "Real negotiation is based on communication and persuasion, rather than simply \nusing authority or forcing the other party to agree. The parties discuss their \npositions and try to influence each other to reach an acceptable outcome."}, {"week": 4, "number": 5, "question": "In Hong Kong, hospital rooms avoid the number four because the sound shi is a \nhomophone for:", "options": ["Poverty", "Illness", "Death", "Bad luck in trade"], "correct": [2], "explanation": "In the cultural example given in the assignment, the Cantonese pronunciation \nassociated with the number four sounds like a word associated with death. Because \nof this association, the number four may be avoided in some settings, such as \nhospital room numbering."}, {"week": 4, "number": 6, "question": "Alfred G. Smith, in Communication and Culture, defines culture as:", "options": ["A code we learn and share", "The sum of a nation's laws and religion", "An unchanging set of inherited traits", "The visible customs of a majority community"], "correct": [0], "explanation": "According to the definition used in the assignment, culture is a code that people \nlearn and share. It influences how people think, behave, communicate and \nunderstand the world around them."}, {"week": 4, "number": 7, "question": "According to the colour-based classification of negotiation styles, which style is a mix of \nthe competitive and the cooperative approaches and is recommended for negotiators?", "options": ["Red style", "Blue style", "Purple style", "Green style"], "correct": [2], "explanation": "The Purple style combines elements of both competitive and cooperative \napproaches. A good negotiator should not always be aggressive or always give in. \nInstead, they should know when to compete and when to cooperate."}, {"week": 4, "number": 8, "question": "According to McGregor, the modern style of management is built on a balance between:", "options": ["Control and freedom", "Profit and loss", "Reward and punishment", "Authority and seniority"], "correct": [0], "explanation": "Modern management should provide employees with some freedom and \nresponsibility, while still maintaining the necessary level of organisational control. \nToo much control can restrict employees, while unlimited freedom can create \nproblems."}, {"week": 4, "number": 9, "question": "ZOPA stands for the _______ of possible agreement, the space in which an agreement \ncan be reached.", "options": ["area", "zone", "medium", "arena"], "correct": [1], "explanation": "ZOPA means Zone of Possible Agreement. It is the range in which both parties can \npotentially reach an agreement that is acceptable to them. \nExample: \nIf a buyer is willing to pay up to ₹1,000 and a seller is willing to accept ₹800 or \nmore, the range ₹800–₹1,000 can be the ZOPA."}, {"week": 4, "number": 10, "question": "Which of the following are listed as qualities of a good negotiator? (Select all that \napply)", "options": ["Confidence", "Rigidity", "Honesty", "Aggression"], "correct": [0, 2], "explanation": "A good negotiator needs confidence to clearly communicate their position and \nnegotiate effectively. Honesty is also important because trust between the parties \nhelps create a successful and sustainable agreement. \nRigidity and aggression can make negotiation more difficult."}, {"week": 4, "number": 11, "question": "In a formal negotiation, which of the following are pre-announced beforehand to both \nparties? (Select all that apply)", "options": ["The personal relationship of the parties", "The agenda", "The fear factor involved", "The venue, date and time"], "correct": [1, 3], "explanation": "In a formal negotiation, both parties should know what will be discussed and when \nand where the negotiation will take place. Therefore, the agenda and the venue, \ndate and time can be announced beforehand. \n \nBefore negotiation → What? When? Where?"}, {"week": 4, "number": 12, "question": "Which two are listed among the subjective factors that affect negotiation? (Select all \nthat apply)", "options": ["The upper and lower limits of concession", "Personal relationship between the parties", "The fear factor", "The written summary of the agreement"], "correct": [1, 2], "explanation": "A person's relationship with the other party can strongly influence how they \nnegotiate. Fear can also affect confidence, decisions and willingness to make \nconcessions. These are subjective because they depend on people's personal \nfeelings and perceptions."}, {"week": 4, "number": 13, "question": "Which of the following peoples are described as belonging to the low-context culture? \n(Select all that apply)", "options": ["Japanese", "Arabs", "North Americans", "Germans"], "correct": [2, 3], "explanation": "In low-context cultures, people generally communicate information more directly \nand explicitly. The assignment identifies North Americans and Germans as \nexamples of low-context cultures. \nThis contrasts with high-context cultures, where people may rely more on \nrelationships, shared knowledge and surrounding circumstances."}, {"week": 4, "number": 14, "question": "According to Maslow's hierarchy, which of the following count as physiological (basic) \nneeds? (Select all that apply)", "options": ["Food", "Creativity", "Morality", "Shelter"], "correct": [0, 3], "explanation": "Physiological needs are the basic requirements necessary for human survival. They \ninclude things such as food, water, sleep and shelter. Creativity and morality belong \nto higher levels of human needs rather than physiological needs."}, {"week": 4, "number": 15, "question": "Americans T. Moving the right hand to express refusal", "options": ["1-R, 2-T, 3-P, 4-Q, 5-S", "1-T, 2-R, 3-Q, 4-P, 5-S", "1-P, 2-T, 3-R, 4-S, 5-Q", "1-R, 2-P, 3-T, 4-S, 5-Q"], "correct": [1], "explanation": "Answer follows the source material's question/option mapping."}, {"week": 5, "number": 1, "question": "The difference in status can cause _______ communication breakdown.", "options": ["organisational", "intrapersonal"], "correct": [0], "explanation": "A difference in status—for example, between a manager and a junior employee—\ncan create an organisational communication breakdown. A junior employee may \nhesitate to speak openly because of the senior person's position or authority. This \n\n  \ncan prevent information from flowing properly."}, {"week": 5, "number": 2, "question": "The goal of business writing is to impress the clients with _______ language.", "options": ["colloquial", "professional"], "correct": [1], "explanation": "Business writing should use professional language that is clear, respectful and \nappropriate for the situation. The purpose is not to impress clients with difficult \nwords, but to communicate ideas effectively and create a professional impression."}, {"week": 5, "number": 3, "question": "Act of plagiarism comes under _______ form of communication breakdown.", "options": ["ethical", "physical"], "correct": [0], "explanation": "Plagiarism is an ethical issue because it involves using someone else's words, \nideas or work dishonestly without proper acknowledgment. Ethical communication \nrequires honesty and giving credit to the original source."}, {"week": 5, "number": 4, "question": "While using _______ plan, a neutral tone should be maintained.", "options": ["a direct", "an indirect"], "correct": [0], "explanation": "A direct plan presents the main idea or purpose clearly and directly, followed by \nsupporting information. The writer should maintain a neutral, professional tone \nrather than using emotional or unnecessarily aggressive language."}, {"week": 5, "number": 5, "question": "Semantic Gap occurs because meanings are _______.", "options": ["confusing", "contextualized"], "correct": [1], "explanation": "The meaning of a word or message can depend on its context, such as the \nsituation, background or circumstances in which it is used. Therefore, the same \nword can sometimes be understood differently by different people."}, {"week": 5, "number": 6, "question": "Which of the following best defines communication breakdown?", "options": ["Failure to write correctly", "Any step that blocks or interferes with message flow", "Misuse of technical jargon", "Lack of vocabulary"], "correct": [1], "explanation": "Communication involves several stages: sending, transmitting, receiving and \nunderstanding a message. If something blocks or interferes with the message at \nany stage, communication can break down. \nExample: \nNoise, unclear language, poor listening or a faulty communication medium can \ninterfere with the message."}, {"week": 5, "number": 7, "question": "Which one of the following statements is/are most suitable for Combative listening?", "options": ["Listening simply to promote/strengthen our own views", "Listening to each and every word of the speaker", "Listening to words and analyzing them simultaneously.", "None of the above"], "correct": [0], "explanation": "In combative listening, a person does not listen mainly to understand the speaker. \nInstead, they listen in a way that helps them defend or strengthen their own \nopinions. They may look for points they can disagree with or argue against. \nExample: \nSomeone is speaking about an idea, but instead of understanding it, you are \nmentally preparing arguments to prove your own opinion is correct."}, {"week": 5, "number": 8, "question": "Which among the following can be the probable cause(s) of communication breakdown?", "options": ["Speaker", "Listner", "Medium of communication", "All of the above"], "correct": [3], "explanation": "Communication depends on several elements. The speaker may send an unclear \nmessage, the listener may misunderstand it, or the medium may create problems—\nfor example, poor internet or a noisy telephone connection. \nTherefore, all three can contribute to communication breakdown."}, {"week": 5, "number": 9, "question": "Which of the following attributes is best related to the geographical pattern of writing \nused in an organization?", "options": ["Topical", "Spatial", "Casual", "Chronological"], "correct": [1], "explanation": "Spatial means related to space or location. Therefore, a spatial pattern organizes \ninformation according to geographical areas, places or physical locations. \nExample: \nA report discussing sales region-wise—North India, South India, East India and \nWest India—is using a spatial/geographical pattern."}, {"week": 5, "number": 10, "question": "Arrange the following in order, from what should be done first to what should be done \nlast. \n \n(i) Researching \n(ii) Revising \n(iii) conceptualizing \n(iv) Drafting", "options": ["iv-ii-iii-i", "ii-iv-i-iii", "iii-i-iv-ii", "i-iii-ii-iv"], "correct": [2], "explanation": "First, you should decide what you want to write and how you will approach it—this is \nconceptualizing. Then you collect relevant information through research. After that, \nyou prepare the first draft. Finally, you revise it to correct errors and improve clarity."}, {"week": 5, "number": 11, "question": "Which organizational characteristics contribute to communication breakdown? (Select \nall that apply)", "options": ["Fear of superior's perception", "Negative attitudes in organization", "Audience-centred approach", "Synergy between verbal and non-verbal"], "correct": [0, 1], "explanation": "If employees are afraid of how their superiors will judge them, they may avoid \nsharing information or opinions. Similarly, negative attitudes within an organization \ncan discourage open and effective communication. \nThe other options—audience-centred approach and synergy between verbal and \nnon-verbal communication—generally support effective communication."}, {"week": 5, "number": 12, "question": "Which of the following are features of effective writing? (select all that apply)", "options": ["Directness", "Use of jargon", "Easy to understand", "Long sentences"], "correct": [0, 2], "explanation": "Effective writing should communicate the message directly and clearly. It should be \neasy for the reader to understand without unnecessary complexity. Excessive \njargon and unnecessarily long sentences can make writing difficult to understand."}, {"week": 5, "number": 13, "question": "A piece of official business writing which is circulated within the organization is called:- \n(Select all that apply)", "options": ["Official letter", "Circular", "Official report", "Memorandum"], "correct": [1, 3], "explanation": "A circular is an official communication distributed to multiple people, usually to \nprovide information or instructions. A memorandum (memo) is also an internal \n\n  \nbusiness communication used to communicate information within an organization."}, {"week": 5, "number": 14, "question": "Which of the following comprise ethical considerations in communication? (Select all \nthat apply)", "options": ["Mixed reactions", "Misquoting", "Plagiarism", "Misunderstanding"], "correct": [1, 2], "explanation": "Misquoting means incorrectly presenting someone's words or statements. \nPlagiarism means using another person's work or ideas without proper credit. Both \nviolate principles of honesty and integrity in communication."}, {"week": 5, "number": 15, "question": "Find out the correct statement(s) about the principles of business writing. (Select all \nthat apply)", "options": ["It should have clarity.", "It should have pompous and erratic words.", "It should be plain and concise.", "Professional tone needs not to be maintained in every situation."], "correct": [0, 2], "explanation": "Business writing should be clear, so the reader understands the message without \nconfusion. It should also be plain and concise, meaning it should use simple, \nappropriate language and avoid unnecessary words. \nUsing pompous or complicated words does not make business writing better. A \nprofessional tone should also be maintained appropriately."}, {"week": 6, "number": 1, "question": "The Simplified format is used when the writer is _______ of the status or gender of the \nreceiver.", "options": ["aware", "not aware"], "correct": [1], "explanation": "The Simplified format can be used when the writer does not know the receiver's \nstatus or gender. It avoids the need for a personal salutation such as \"Dear Mr.\" or \n\"Dear Ms.\" This makes the letter more neutral and suitable for unknown recipients."}, {"week": 6, "number": 2, "question": "A business letter should end with _______.", "options": ["a clear warning", "a hopeful statement"], "correct": [1], "explanation": "A business letter should generally end on a positive and hopeful note. Even when \nthe subject of the letter is serious, the closing should maintain goodwill and leave \nthe reader with a positive impression. \nFor example: \n\"We look forward to hearing from you soon.\""}, {"week": 6, "number": 3, "question": "While replying to _______, the subject line should avoid being a complete sentence.", "options": ["letters of enquiry", "letters of confirmation"], "correct": [0], "explanation": "A letter of enquiry is written to ask for information about something, such as a \nproduct, price, service or availability. The subject line should quickly tell the reader \n\n  \nwhat information is being requested."}, {"week": 6, "number": 4, "question": "In business letter, _______ tone should be followed.", "options": ["an informal", "a neutral"], "correct": [1], "explanation": "A business letter should use a neutral, professional and respectful tone. It should \nnot sound overly casual or emotional. The purpose is to communicate information \nclearly while maintaining professionalism."}, {"week": 6, "number": 5, "question": "A collection letter usually starts with a _______ tone and gradually becomes stronger if \npayment is delayed.", "options": ["gentle", "harsh"], "correct": [0], "explanation": "The first collection letter usually uses a gentle and polite tone because the customer \nmay simply have forgotten or experienced a minor delay. If the payment continues \nto be delayed, later letters can become more firm."}, {"week": 6, "number": 6, "question": "Which of the following is not true about a research paper?", "options": ["It is a formal and systematic piece of writing.", "It adds to the existing repertoire of knowledge.", "It is an accumulation of philosophical ideas with fallacious findings.", "It is a process of discovering new and novel ideas."], "correct": [2], "explanation": "A research paper is a formal and systematic piece of writing based on research, \nevidence and analysis. It may contribute new knowledge or ideas. However, it \nshould not be based on fallacious (false or logically incorrect) findings. \n \nResearch paper → Evidence + Systematic study + Reliable findings"}, {"week": 6, "number": 7, "question": "Which among the following is not a characteristic feature of a refusal letter?", "options": ["It should ignore the applicant's request.", "It should state reasons of refusal and retain goodwill.", "Use of harsh language is not acceptable here.", "It should avoid suggesting alternatives."], "correct": [0], "explanation": "A refusal letter should not ignore the person's request. Instead, it should \nacknowledge the request, explain the reason for refusal where appropriate, and try \nto maintain goodwill. The language should remain polite rather than harsh. \nExample: \nInstead of simply saying \"No, your request is rejected,\" a professional letter should \nexplain the situation respectfully."}, {"week": 6, "number": 8, "question": "Which of the following is a key feature of minutes of a meeting?", "options": ["Written in future tense", "Logical sequencing of events", "Use of complex language", "Avoiding names of members"], "correct": [1], "explanation": "Meeting minutes should record the events and decisions in a logical order. They \nshould clearly show what was discussed, what decisions were made and what \nactions were assigned. \nThey should not use unnecessarily complicated language or avoid mentioning \nimportant participants. \n \nMinutes → Clear + Accurate + Logical sequence"}, {"week": 6, "number": 9, "question": "A person believes that only he matters and disregards others, saying \"I'm okay, you are \nnot okay.\" To which category of personality does such a person belong?", "options": ["Introvert", "Imposing", "Positive", "Negative"], "correct": [1], "explanation": "An imposing person tries to place their own needs, opinions or importance above \nothers. The statement \"I'm okay, you are not okay\" shows that the person considers \n\n  \nthemselves right or valuable while looking down on others. \n \n\"I'm okay + You're not okay\" → Imposing attitude"}, {"week": 6, "number": 10, "question": "Which of the following parts of a letter explains the qualities of the product and its \nspecial features?", "options": ["title", "salutation", "body", "subject"], "correct": [2], "explanation": "The body is the main part of a letter. It contains the actual message and important \ndetails. Therefore, information about a product's qualities, features, benefits and \nother details would normally be explained in the body."}, {"week": 6, "number": 11, "question": "What should be the primary goal(s) of an adjustment letter? (Select all that apply)", "options": ["Rectification of the earlier mistake(s)", "Neglecting future business proposals", "Regaining the customer's confidence", "Avoiding customer's feedback"], "correct": [0, 2], "explanation": "An adjustment letter should try to correct or resolve the problem that caused the \ncustomer's complaint. At the same time, the organization should rebuild the \ncustomer's trust and confidence. \nThe purpose is not to ignore future business or avoid customer feedback."}, {"week": 6, "number": 12, "question": "Which guidelines should be followed while drafting recommendation letters? (Select all \nthat apply)", "options": ["Honesty", "Use of vague remarks", "Focus on the personal information of the candidate", "Confidentiality"], "correct": [0, 3], "explanation": "A recommendation letter should contain honest and truthful information about the \nperson. It should also respect confidentiality, meaning private or sensitive \ninformation should not be unnecessarily disclosed. \nVague remarks can make a recommendation less useful."}, {"week": 6, "number": 13, "question": "Which practice(s) among the following should be avoided in professional e-mail \ncommunication? (Select all that apply)", "options": ["Using words in capital letters", "Sarcasm or satire", "Subject", "Salutation in the content of the e-mail"], "correct": [0, 1], "explanation": "Writing entire words or sentences in CAPITAL LETTERS can appear as if you are \nshouting at the reader. Sarcasm and satire can also easily be misunderstood in \nwritten communication because the reader cannot hear your tone of voice. \nA professional email should be clear, polite and respectful."}, {"week": 6, "number": 14, "question": "Which of the following are essential components of professional meeting \ndocumentation? (Select all that apply)", "options": ["Verbal Reports and Chat Logs", "Agenda", "Informal Memos", "Minutes"], "correct": [1, 3], "explanation": "An agenda tells participants what topics will be discussed during the meeting. \nMinutes provide the official record of what was discussed, what decisions were \nmade and what actions were assigned."}, {"week": 6, "number": 15, "question": "When a customer lodges a complaint and an organization writes an adjustment letter, \nwhich of the following strategies should be followed? (Select all that apply)", "options": ["Open the letter by directly conveying the coercive measures taken", "Use pleasant language in the opening sentence", "Avoid using negative words", "Make broad, unrealistic promises"], "correct": [1, 2], "explanation": "An adjustment letter should begin in a pleasant and respectful manner so that the \ncustomer feels heard and valued. The writer should also avoid unnecessarily \nnegative words that could make the situation worse. \nThe organization should not begin with threats or make unrealistic promises that it \ncannot fulfil."}, {"week": 7, "number": 1, "question": "Data collected from internet sources are considered a primary source of data collection.", "options": ["True", "False"], "correct": [1], "explanation": "Internet sources generally provide information that has already been collected or \npublished by someone else. Therefore, they are treated as a secondary source of \ndata in this assignment. Primary data is collected directly through methods such as \ninterviews, observation or questionnaires."}, {"week": 7, "number": 2, "question": "Personal observation reports behaviour instead of interpreting it.", "options": ["True", "False"], "correct": [0], "explanation": "Personal observation focuses on directly observing and recording what people \nactually do. The observer reports the behaviour rather than immediately adding \npersonal interpretations or assumptions about why the person behaved that way. \nExample: \nInstead of writing \"The employee was angry,\" an observer may record \"The \nemployee raised their voice and left the room.\""}, {"week": 7, "number": 3, "question": "The bias of the interviewer cannot interfere in a telephonic interview.", "options": ["True", "False"], "correct": [1], "explanation": "An interviewer's personal opinions, expectations or assumptions can influence how \nthey ask questions, interpret answers or respond to the interviewee. This can \nhappen even when the interview is conducted over the telephone."}, {"week": 7, "number": 4, "question": "The process of seeking information directly through a conversation with an individual is \ncalled a personal interview.", "options": ["True", "False"], "correct": [0], "explanation": "A personal interview involves direct communication between the interviewer and the \nperson providing information. The interviewer asks questions and obtains \ninformation through conversation. \nExample: \nA researcher asking employees questions face-to-face to understand their \nworkplace experience is conducting a personal interview."}, {"week": 7, "number": 5, "question": "Literary writings always follow a fixed structure and are directed toward a fixed \naudience, leaving little scope for variation or reinterpretation.", "options": ["True", "False"], "correct": [1], "explanation": "Literary writing can take many forms and styles. It can allow creativity, variation and \n\n  \ndifferent interpretations by different readers. Unlike technical reports, literary writing \ndoes not necessarily follow one fixed structure."}, {"week": 7, "number": 6, "question": "Which of the following sampling is based on the probability method?", "options": ["Snowball sampling", "Quota sampling", "Random sampling", "Judgment sampling"], "correct": [2], "explanation": "In random sampling, members are selected randomly rather than because the \nresearcher personally chooses them. This makes it a probability sampling method. \nThe other options—snowball, quota and judgment sampling—are generally \nassociated with non-probability sampling."}, {"week": 7, "number": 7, "question": "Which among the following types of reports are generally written at regular but fixed \nintervals?", "options": ["Management reports", "Technical reports", "Routine reports", "Special reports"], "correct": [2], "explanation": "Routine reports are prepared regularly as part of normal organizational activities. \nFor example, an organization may prepare weekly, monthly or quarterly reports \naccording to a predetermined schedule. \nRemember: \nRegular + Fixed intervals → Routine reports"}, {"week": 7, "number": 8, "question": "Which among the following is an example of secondary source of data collection?", "options": ["Books", "Internet sources", "Journals", "All of the above"], "correct": [3], "explanation": "Books, internet sources and journals can all provide previously available \ninformation. Therefore, they can be used as secondary sources of data."}, {"week": 7, "number": 9, "question": "Which of the following best defines \"circumlocution\" in report writing?", "options": ["Use of technical jargon", "Use of pompously wordy expressions", "Use of clichés repeatedly", "Use of redundancy in sentences"], "correct": [1], "explanation": "Circumlocution means using unnecessarily long, complicated or wordy expressions \ninstead of saying something simply and directly."}, {"week": 7, "number": 10, "question": "Which of the following is/are true about personal observation as a method of data \ncollection?", "options": ["It is costlier and time-consuming than the other methods of data collection.", "It both interprets and reports human behaviour", "It is a holistic method in itself.", "Both A and B"], "correct": [3], "explanation": "Personal observation requires the researcher to personally observe and record \nbehaviour, which can require considerable time and effort. Therefore, it can be \nmore expensive and time-consuming than some other methods."}, {"week": 7, "number": 11, "question": "Which among the following are the preparatory steps for report writing?", "options": ["Choose a random method for data collection", "Identify your purpose and scope", "Overlook the audience", "Make an outline"], "correct": [1, 3], "explanation": "Before writing, you should first understand why you are writing the report and what \nit will cover. Then, preparing an outline helps organize the information in a logical \norder. \n\n  \n \nPurpose & Scope → Outline → Write the report"}, {"week": 7, "number": 12, "question": "Which of the following are disadvantages of observation as a data collection method?", "options": ["Costlier and slower", "Provides first-hand knowledge", "Reports behaviour rather than interpretation", "Helps study non-verbal behaviour"], "correct": [0], "explanation": "Observation requires the researcher to spend time watching and recording \nbehaviour. Therefore, it can be slower and more expensive than some other \nmethods of collecting data. \nThe other options describe useful features or advantages of observation."}, {"week": 7, "number": 13, "question": "Which of the following practices should be avoided in report writing to maintain clarity \nand professionalism?", "options": ["Use of small sentences", "Use of foreign words and phrases unnecessarily", "Use of familiar and plain words", "Use of redundancy"], "correct": [1], "explanation": "Unnecessary foreign words or phrases can make a report difficult for readers to \nunderstand. Redundancy means repeating information or using unnecessary words. \nBoth should be avoided in professional report writing."}, {"week": 7, "number": 14, "question": "Which of the following are advantages of questionnaires?", "options": ["Convenient for the respondent", "Ensures representative sample always", "Provides detailed observation data", "Eliminates interviewer bias"], "correct": [0, 1], "explanation": "A questionnaire allows respondents to provide answers conveniently, often without \n\n  \nneeding a direct conversation with an interviewer. It can also reduce interviewer \nbias, because the interviewer does not have to influence the respondent through \npersonal interaction. \nHowever, a questionnaire does not automatically guarantee a representative \nsample."}, {"week": 7, "number": 15, "question": "Which of the following statements correctly distinguish between technical reports and \nliterary writings?", "options": ["Technical reports are written on the demand of organisation, whereas literary \nwritings are written on the demand of specific social groups.", "Technical reports have a fixed structure, whereas literary writings follow no fixed \nstructure.", "Technical reports are subjective in approach, whereas literary writings are objective \nin approach.", "Technical reports use plain language, whereas literary writings often employ \nrhetorical language."], "correct": [3], "explanation": "Technical reports are generally structured and organized so that information can be \npresented clearly and systematically. They usually prefer plain, precise language.  \nLiterary writing is more flexible and can use rhetorical, creative and expressive \nlanguage. It may not follow the fixed structure expected in a technical report."}, {"week": 8, "number": 1, "question": "A member in a Group discussion should speak at the top of his voice to make himself \nheard by the leader.", "options": ["True", "False"], "correct": [1], "explanation": "In a group discussion, a participant should speak clearly and confidently, but there \nis no need to shout or use the loudest possible voice. The goal is to communicate \nideas effectively while respecting other participants."}, {"week": 8, "number": 2, "question": "The introduction of a report should include background, problem statement, scope, \nlimitations, and sources of data.", "options": ["True", "False"], "correct": [0], "explanation": "The introduction gives the reader the necessary background and context of the \nreport. It can explain the problem being studied, the scope of the report, its \nlimitations and the sources from which the information was obtained. \n \nIntroduction → Background + Problem + Scope + Limitations + Data sources     Soft \nSkill Week 8"}, {"week": 8, "number": 3, "question": "According to Peter Drucker, in emergencies like a ship sinking, meetings are the best \nway to decide actions.", "options": ["True", "False"], "correct": [1], "explanation": "In an emergency, there is often very little time for lengthy discussion or meetings. \nImmediate action and quick decision-making are more important. Therefore, \nmeetings are not considered the best approach in such situations. \n \n Emergency → Quick action, not lengthy meetings."}, {"week": 8, "number": 4, "question": "Active voice is generally preferred in report writing to maintain clarity and vigor.", "options": ["True", "False"], "correct": [0], "explanation": "Active voice clearly shows who performed the action. This often makes professional \nwriting more direct, concise and energetic."}, {"week": 8, "number": 5, "question": "Using foreign words and unfamiliar abbreviations makes a report more professional.", "options": ["True", "False"], "correct": [1], "explanation": "Professional writing should focus on clarity and understanding, not on using \nunnecessarily complicated language. Unfamiliar abbreviations and foreign words \ncan confuse readers if they are not explained."}, {"week": 8, "number": 6, "question": "Which of the following elements is not typically included in the executive summary of a \nreport?", "options": ["Objectives", "Findings", "Methodology", "References"], "correct": [3], "explanation": "An executive summary can briefly present the objectives, methodology and \nimportant findings of a report. A detailed list of references is normally provided \nseparately rather than inside the executive summary."}, {"week": 8, "number": 7, "question": "What should be the characteristics of an ideal team member in a group?", "options": ["To share a common leadership", "To hold joint accountability for performance", "To work dedicatedly for achieving a common goal", "All of the above"], "correct": [3], "explanation": "An ideal team member should contribute to shared leadership, accept joint \nresponsibility for performance, and work sincerely toward the common goal. \nTeamwork is about cooperation and shared responsibility rather than only individual \nsuccess."}, {"week": 8, "number": 8, "question": "Why does a bibliography differ from a list of references in a report?", "options": ["A bibliography includes only cited works.", "A bibliography covers all reading, including background material.", "A bibliography excludes secondary sources.", "A bibliography is arranged strictly by date of publication."], "correct": [1], "explanation": "A reference list generally contains works that have been specifically cited in the \nreport. A bibliography can be broader and may include materials that the writer \nconsulted for background or understanding, even if they were not directly cited."}, {"week": 8, "number": 9, "question": "Which category best describes expressions such as \"Return back\" and \"past history\" in \nreport writing?", "options": ["Jargon", "Redundancy", "Circumlocution", "Foreign phrases"], "correct": [1], "explanation": "Redundancy occurs when extra words are used even though their meaning is \nalready included in another word"}, {"week": 8, "number": 10, "question": "Which of the following is a maintenance role in group communication?", "options": ["Controlling", "Withdrawing", "Harmonising", "Diverting"], "correct": [2], "explanation": "Harmonising means helping people resolve disagreements and maintain harmony \n\n  \nwithin the group. It is therefore considered a maintenance role because it supports \nhealthy relationships among team members."}, {"week": 8, "number": 11, "question": "Which among the following is/are true about task facilitating roles in a group? (Select \nall that apply)", "options": ["Diverting", "Initiating", "Controlling", "Co-ordinating"], "correct": [1, 2, 3], "explanation": "Initiating helps start ideas or activities. Controlling helps keep the group's work \nfocused and organized. Co-ordinating helps different members work together \neffectively. \nDiverting, on the other hand, does not help the group stay focused on its task."}, {"week": 8, "number": 12, "question": "Which of the following techniques improve sentence style in reports? (Select all that \napply)", "options": ["Use of emphatic word order", "Preferring lengthy noun clusters", "Use of parallel constructions", "Avoiding transitions"], "correct": [0, 2], "explanation": "Emphatic word order places important information where it receives emphasis. \nParallel construction uses a consistent grammatical pattern, making related ideas \neasier to read and compare. \nExample of parallel construction: \nThe manager planned the project, organized the team and monitored the work. \nThe verbs planned, organized, monitored follow the same structure. \nRemember: \nBetter sentence style → Emphasis + Parallel structure     Soft Skill Week 8"}, {"week": 8, "number": 13, "question": "Which of the following are part of the Introduction section of a report? (Select all that \napply)", "options": ["Glossary", "Index", "Statement of the problem", "Scope of the problem"], "correct": [2, 3], "explanation": "The introduction should explain what problem the report is addressing and how \nbroadly or narrowly the problem will be studied. A glossary and index are normally \nseparate parts of the report."}, {"week": 8, "number": 14, "question": "Which of the following are transitional elements that help coherence? (Select all that \napply)", "options": ["Hidden agenda, groupthink", "Moreover, furthermore", "Therefore, consequently", "Index, glossary"], "correct": [1, 2], "explanation": "These are transitional words/phrases. They show relationships between ideas. \n- Moreover / Furthermore → Adds another point. \n- Therefore / Consequently → Shows a result or conclusion. \nExample: \n\"The company reduced costs. Therefore, profits increased.\""}, {"week": 8, "number": 15, "question": "Which of the following are listed as advantages of group communication? (Select all \nthat apply)", "options": ["Diverse views", "Groupthink", "Hidden agendas", "Sense of belonging"], "correct": [0, 3], "explanation": "Group communication allows people with different experiences and ideas to \ncontribute diverse views. It can also create a sense of belonging, because members \nfeel connected to and involved with the group. \nGroupthink and hidden agendas are not advantages; they can create problems \nwithin group communication."}, {"week": 9, "number": 1, "question": "Which one would not be considered by a good leader?", "options": ["Laissez-faire", "Democratic style", "Autocratic style", "Transformational and Transactional"], "correct": [2], "explanation": "An autocratic leader makes decisions mainly by themselves and gives limited \nopportunity to other members to participate. Good leadership generally encourages \nparticipation, cooperation and involvement. Therefore, according to the assignment, \nautocratic style is the option that would not be considered by a good leader."}, {"week": 9, "number": 2, "question": "Visionary leaders are skilled in:", "options": ["Explaining the vision", "Expressing the vision through behaviour and action", "Extend the vision to different contexts", "All of the above"], "correct": [3], "explanation": "A visionary leader should be able to explain the vision, demonstrate it through \nbehaviour and action, and apply or extend the vision to different situations and \ncontexts. Having a vision alone is not enough; the leader must communicate and \ndemonstrate it effectively."}, {"week": 9, "number": 3, "question": "The feature of Charismatic Leadership are", "options": ["Vision and self-confidence", "To articulate the vision", "Extra-ordinary behaviour", "All of the above"], "correct": [3], "explanation": "Charismatic leadership involves qualities such as vision, self-confidence, the ability \nto articulate the vision and extraordinary behaviour. Such leaders can inspire and \ninfluence others through their personality and strong communication."}, {"week": 9, "number": 4, "question": "Group discussion is a _______ face-to-face communication among participants to \nexpress and exchange their views on a topic.", "options": ["formal and systematic", "informal", "individual", "intuitive"], "correct": [0], "explanation": "A group discussion is a formal and systematic face-to-face communication where \nparticipants express, exchange and discuss their views about a particular topic. \nParticipants are expected to communicate logically and respectfully."}, {"week": 9, "number": 5, "question": "Group Discussion allows", "options": ["a dialogic learning process", "cooperative and every member be given an opportunity to speak", "of sharing thoughts, opinions, views", "All of these"], "correct": [3], "explanation": "A group discussion provides a dialogic learning process, gives members an \nopportunity to speak cooperatively, and allows participants to share thoughts, \nopinions and views. Therefore, all three statements are correct."}, {"week": 9, "number": 6, "question": "Which one should be avoided as a group responsibility?", "options": ["to fulfil an individual assignment", "interpersonal conflict", "a full participation", "None of These"], "correct": [1], "explanation": "Interpersonal conflict means disagreement or conflict between individuals. While \ndifferences of opinion can happen in a group, personal conflict can damage \ncooperation and prevent the group from achieving its common goal. \nA good group should encourage full participation and cooperation rather than \npersonal conflicts."}, {"week": 9, "number": 7, "question": "The role of a leader has not been:", "options": ["to decide the agenda of meeting", "to convince the rest of the group", "saving it from getting sidetracked", "discourage a less vocal member"], "correct": [3], "explanation": "A good leader should help the group stay focused, guide the discussion and \nencourage participation. A less vocal member should not be discouraged; instead, \nthe leader should give them an opportunity to contribute. \n \nGood leader → Include people, don't silence them. \nThe other responsibilities include deciding the agenda, convincing the group when \nappropriate and preventing the discussion from getting sidetracked"}, {"week": 9, "number": 8, "question": "What is not meant by leadership?", "options": ["Rational arguments", "Influencing the proceeding by constructive participation", "Convincing other participants", "None of These"], "correct": [3], "explanation": "According to the assignment, all three activities can be associated with leadership. \nA leader may use rational arguments, participate constructively and convince other \nparticipants to support an idea. \nTherefore, none of the listed options should be excluded."}, {"week": 9, "number": 9, "question": "What are the things to be avoided during a group discussion?", "options": ["Listening", "Politeness", "take extreme stance", "Organise the ideas before participating"], "correct": [2], "explanation": "Taking an extreme stance means strongly supporting one side without being willing \nto consider other viewpoints. In a GD, participants should be open to different \nopinions and should support their ideas with logical reasoning."}, {"week": 9, "number": 10, "question": "Which one of the following is not evaluated during a group discussion?", "options": ["Candidate's awareness", "Leadership", "Hypocrisy", "Clarity of thoughts"], "correct": [2], "explanation": "During a GD, qualities such as awareness, leadership and clarity of thoughts can be \nevaluated. Hypocrisy is not listed as a standard evaluation criterion in the \nassignment."}, {"week": 9, "number": 11, "question": "Adaptability shows the ability to learn from experience, and improves the fitness of the \nlearner as a competitor.", "options": ["True", "False"], "correct": [0], "explanation": "Adaptability means being able to adjust to new situations and learn from \nexperience. A person who adapts can improve their skills and respond more \neffectively when circumstances change. \nExample: \nIf a student learns from a mistake and changes their study method, they are \ndemonstrating adaptability."}, {"week": 9, "number": 12, "question": "The sole purpose of a group discussion is to check the candidate's fluency.", "options": ["True", "False"], "correct": [1], "explanation": "Fluency can be one aspect of communication, but a GD evaluates many other \nabilities, such as awareness, clarity of thoughts, leadership, participation, listening \nand the ability to work with others. \n \nGD ≠ Only fluency \nIt evaluates multiple communication and interpersonal skills"}, {"week": 9, "number": 13, "question": "A meeting without an agenda is like a journey without a destination", "options": ["True", "False"], "correct": [0], "explanation": "An agenda tells participants what topics need to be discussed and gives the \nmeeting a clear direction. Without an agenda, a meeting can become unfocused, \nwaste time or move into unrelated topics."}, {"week": 9, "number": 14, "question": "Every group discussion should aim at a logical conclusion.", "options": ["True", "False"], "correct": [0], "explanation": "A good group discussion should not simply involve people speaking without \ndirection. Participants should listen to different views, evaluate the ideas and try to \nreach a logical conclusion based on the discussion."}, {"week": 9, "number": 15, "question": "Employees should be considered as more than just a means to a goal.", "options": ["True", "False"], "correct": [0], "explanation": "Employees are not simply resources used to achieve organizational targets. They \nare people with abilities, needs, ideas and individual value. Good leadership and \n\n  \nmanagement should therefore respect and value employees while working toward \norganizational goals."}, {"week": 10, "number": 1, "question": "Speaking skills are _______ communication coupled with _______ cues.", "options": ["verbal, verbal", "non-verbal, verbal", "verbal, non-verbal", "non-verbal, non-verbal"], "correct": [2], "explanation": "Speaking involves verbal communication, which means the actual words we use, \nalong with non-verbal cues, such as facial expressions, gestures, eye contact and \nposture. Both work together to make communication effective. \nExample: \nSaying \"I am happy\" is verbal communication, while smiling while saying it is a non-\nverbal cue."}, {"week": 10, "number": 2, "question": "The importance of advanced speaking skills are", "options": ["Expressing views", "Maintaining social and business relationship", "Establishing credibility", "All of these"], "correct": [3], "explanation": "Good speaking skills help us express our views clearly, maintain social and \nbusiness relationships, and establish credibility or trust. Therefore, all three options \nare benefits of advanced speaking skills."}, {"week": 10, "number": 3, "question": "Which of the following are the key components of effective speaking?", "options": ["Voice, Vocabulary, Audience, Style", "Reading, Writing, Listening, Thinking", "Loudness, Speed, Silence", "Grammar, Spelling, Punctuation, Syntax"], "correct": [0], "explanation": "Effective speaking depends on how we use our voice, the words/vocabulary we \nchoose, our understanding of the audience, and our speaking style. A good speaker \nadjusts these according to the situation and listeners."}, {"week": 10, "number": 4, "question": "Which of the following has been considered as an effective Oral Presentation?", "options": ["Informative and persuasive", "Use of visual aids", "Decision-making involved and the question-answer session", "All of these"], "correct": [3], "explanation": "An effective oral presentation can be informative and persuasive, use appropriate \nvisual aids, and involve interaction such as decision-making and question-answer \nsessions. These elements can help the audience understand and engage with the \npresentation."}, {"week": 10, "number": 5, "question": "Which of the following defines a Debate?", "options": ["argumentative ability and logical opinion", "an informal exchange of ideas", "one-sided informative talk", "None of these"], "correct": [0], "explanation": "A debate is a structured discussion in which people present different viewpoints and \nsupport their positions using arguments and logical reasoning. It is not simply an \ninformal conversation. \nExample: \nTwo teams discussing \"Should college education be completely online?\" and giving \nreasons for and against the topic is a debate."}, {"week": 10, "number": 6, "question": "Oral communication, ability to express one's thoughts and emotions by speech sounds \nand gesture are called _______.", "options": ["Oral Presentations", "Speeches", "Presentations", "Debates"], "correct": [1], "explanation": "A speech is a form of oral communication in which a speaker expresses ideas, \nthoughts or emotions to an audience. Gestures and other non-verbal signals can \nsupport the spoken message."}, {"week": 10, "number": 7, "question": "Which of the following is considered a practice for stress busting?", "options": ["Start with a pause and speak slowly", "Speak slowly and distinctly", "Review when you forget", "All of these"], "correct": [3], "explanation": "Starting with a pause and speaking slowly, speaking slowly and distinctly, and \nreviewing your thoughts when you forget something can all help reduce \nnervousness. Speaking calmly gives you time to think and communicate clearly."}, {"week": 10, "number": 8, "question": "One of the reasons for becoming nervous is...?", "options": ["being seasoned", "familiarity", "unfamiliarity with topic or crowd", "None of these"], "correct": [2], "explanation": "People can become nervous when they are not familiar with the topic or when they \

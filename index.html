nare speaking in front of an unfamiliar audience. Lack of preparation or experience \ncan increase uncertainty and nervousness. \nExample: \nIf you have to speak about a topic you have never studied in front of 100 unfamiliar \npeople, you may feel nervous."}, {"week": 10, "number": 9, "question": "Awareness of the audience, clarity of purpose, appropriate selection of the topic, and \neffective utilisation of visual aids constitute the fundamental prerequisites for _______.", "options": ["an oral presentation.", "Combating nervousness", "Leadership skills", "Adaptability and Work Ethics"], "correct": [0], "explanation": "Before giving an oral presentation, a speaker should understand who the audience \nis, decide what they want to achieve, select an appropriate topic and use visual aids \neffectively. These factors help make the presentation successful."}, {"week": 10, "number": 10, "question": "Which of the following is a recommended step while deciding a topic for an oral \npresentation?", "options": ["Choose a familiar subject", "Use references", "Formulate your specific purpose statement", "All of these"], "correct": [3], "explanation": "A speaker should choose a familiar subject, use appropriate references to gather \ninformation, and formulate a specific purpose statement. Together, these steps help \ncreate a focused and well-prepared presentation."}, {"week": 10, "number": 11, "question": "Conversation is an art and it can be mastered through advanced speaking skills.", "options": ["True", "False"], "correct": [0], "explanation": "Good conversation requires more than simply speaking. It involves choosing \nappropriate words, using the right tone, listening, responding properly and \nunderstanding the other person. These abilities can be improved with practice and \nadvanced speaking skills."}, {"week": 10, "number": 12, "question": "Press briefing and orientation are popular examples of presentation.", "options": ["True", "False"], "correct": [0], "explanation": "A press briefing provides information to journalists or the media, while an orientation \nintroduces people to a new organization, course, workplace or process. Both \ninvolve structured communication to an audience and are therefore examples of \npresentations."}, {"week": 10, "number": 13, "question": "Anxiety is a psychological and physiological state characterized by cognitive, somatic, \nemotional, and behavioral components that create an unpleasant feeling of uneasiness, \nfear, or worry.", "options": ["True", "False"], "correct": [0], "explanation": "Anxiety can involve thoughts, physical reactions, emotions and behaviour. It may \nproduce feelings such as worry, fear, uneasiness or nervousness. Therefore, the \nstatement correctly describes anxiety."}, {"week": 10, "number": 14, "question": "The extemporaneous method of presentation necessitates a thorough understanding of \nthe subject matter.", "options": ["True", "False"], "correct": [0], "explanation": "In an extemporaneous presentation, the speaker does not simply read a fully written \nspeech word-for-word. Instead, they speak naturally using preparation, notes or an \noutline. Therefore, they need a thorough understanding of the subject to speak \nconfidently and respond appropriately."}, {"week": 10, "number": 15, "question": "The oral presentation should be audience specific.", "options": ["True", "False"], "correct": [0], "explanation": "A good presentation should be audience-specific. The speaker should consider the \naudience's knowledge, interests, age, needs and expectations. The same topic may \nneed to be explained differently to school students, technical experts or business \nprofessionals."}, {"week": 11, "number": 1, "question": "During a presentation, a speaker aims to maintain audience engagement and project \nconfidence. Which combination of practices would be most appropriate?", "options": ["Read the slides continuously and avoid eye contact", "Maintain eye contact, move naturally, and control voice and vocabulary", "Memorize the entire presentation and avoid visual aids", "Speak rapidly and use frequent digressions"], "correct": [1], "explanation": "A good presenter should maintain eye contact, use natural body movements, and \ncontrol their voice, vocabulary and speaking style. Reading slides continuously or \nspeaking too quickly can reduce audience engagement."}, {"week": 11, "number": 2, "question": "A speaker records a practice presentation and reviews the recording afterward. What is \nthe primary purpose of this activity?", "options": ["To replace rehearsal", "To assess and improve the effectiveness of the presentation", "To memorize every sentence", "To eliminate the need for feedback"], "correct": [1], "explanation": "A good presenter should maintain eye contact, use natural body movements, and \ncontrol their voice, vocabulary and speaking style. Reading slides continuously or \nspeaking too quickly can reduce audience engagement."}, {"week": 11, "number": 3, "question": "At the conclusion of a conference, a speaker is requested to acknowledge the \norganizers, guests, and other contributors. What would be the most appropriate approach?", "options": ["Thank people randomly and provide lengthy personal comments", "Prepare a list of people, follow proper order, and thank them with reasons", "Mention only the chief guest", "Avoid mentioning the organizers"], "correct": [1], "explanation": "When giving a vote of thanks, the speaker should prepare a list of people who \ncontributed to the event and thank them in an appropriate order. Giving a reason for \nthe thanks makes the acknowledgement more meaningful and professional."}, {"week": 11, "number": 4, "question": "Which of the following best distinguishes a welcome speech from a vote of thanks?", "options": ["A welcome speech introduces and welcomes participants, whereas a vote of thanks \nexpresses gratitude to contributors.", "A welcome speech honours deceased persons, whereas a vote of thanks introduces \nguests.", "Both speeches have exactly the same purpose.", "A welcome speech is always longer than a vote of thanks."], "correct": [0], "explanation": "A welcome speech is generally given at the beginning of an event to welcome \nguests and participants and introduce the occasion. A vote of thanks is usually \ngiven toward the end to express gratitude to people who contributed to the event."}, {"week": 11, "number": 5, "question": "A company interviews an employee who is leaving the organization to understand the \nreasons for departure and obtain feedback. This is an example of a:", "options": ["Persuasive interview", "Evaluation interview", "Exit interview", "Counselling interview"], "correct": [2], "explanation": "An exit interview is conducted when an employee leaves an organization. The \norganization may ask about the reasons for leaving, the employee's experience and \nsuggestions for improvement."}, {"week": 11, "number": 6, "question": "Which of the following represents a possible sequence in the job interview process?", "options": ["Screening of applications → Appraisal of CVs → Competency tasks → \nPsychological tests", "Medical tests → CV appraisal → Screening → Group discussion", "Negotiation → Screening → Competency tasks → Application", "Group discussion → Application screening → Medical test → CV preparation"], "correct": [0], "explanation": "Recruitment normally begins by screening applications, followed by evaluating \ncandidates' CVs. Candidates may then undergo competency assessments or tasks \nand, where applicable, psychological tests. \nThe other options put stages in an illogical order."}, {"week": 11, "number": 7, "question": "A candidate determines that job security, expertise, and material rewards strongly \ninfluence their career choices. This is part of understanding one's:", "options": ["Personality", "Motivation", "Work culture", "Leadership style"], "correct": [1], "explanation": "Motivation refers to the factors that encourage or drive a person to choose a \nparticular career, perform a task or achieve a goal. If job security, expertise and \n\n  \nmaterial rewards influence someone's choices, they are part of that person's career \nmotivation."}, {"week": 11, "number": 8, "question": "Which set contains factors that should be considered while analyzing a job position?", "options": ["Responsibilities, special duties, challenges, and expert areas", "Family background, hobbies, and personal interests", "Salary history, friends, and social media activity", "Dress, hairstyle, and interview posture"], "correct": [0], "explanation": "When analyzing a job, you should understand what responsibilities you will have, \nwhat special duties are involved, what challenges you may face and what areas of \nexpertise are required. \nThings such as hairstyle, friends or social media activity do not define the actual \nrequirements of the job."}, {"week": 11, "number": 9, "question": "Which statement best describes the primary purpose of a résumé?", "options": ["To provide every detail about the candidate's personal and professional life", "To create employer interest and generate an interview", "To guarantee employment", "To replace the interview process"], "correct": [1], "explanation": "A résumé is not meant to tell the employer every detail of your life or guarantee \nemployment. Its main purpose is to present your qualifications clearly enough to \ninterest the employer and help you obtain an interview."}, {"week": 11, "number": 10, "question": "Which combination represents appropriate general résumé guidelines?", "options": ["8-point font, unlimited length, poor-quality paper", "10–12 point font, concise content, good-quality paper", "16-point font, lengthy descriptions, coloured paper", "6-point font, maximum possible information, handwritten format"], "correct": [1], "explanation": "A résumé should be easy to read, concise and professional. A standard readable \nfont size such as 10–12 points is appropriate. The information should be relevant \nrather than unnecessarily lengthy."}, {"week": 11, "number": 11, "question": "Recording a presentation and seeking honest feedback from friends are both \nrecommended ways of evaluating and improving one's presentation.", "options": ["True", "False"], "correct": [0], "explanation": "Recording helps you observe your own performance, while feedback from friends or \nothers can reveal problems you may not notice yourself. Using both methods can \nhelp improve delivery, confidence, voice and body language."}, {"week": 11, "number": 12, "question": "The opening and closing of a speech are important because the beginning should \nleave a message memorable to the audience while the closing establishes intimacy.", "options": ["True", "False"], "correct": [1], "explanation": "The opening and closing are both important, but the statement gives an incorrect \ndescription of their purposes. A strong opening should capture attention and \nestablish the topic, while a strong closing should leave the audience with a clear \nand memorable final message."}, {"week": 11, "number": 13, "question": "Recruiters are concerned only with whether a candidate gives correct answers.", "options": ["True", "False"], "correct": [1], "explanation": "Recruiters generally consider more than just whether an answer is correct. They \ncan also evaluate communication skills, confidence, attitude, problem-solving \nability, behaviour and overall suitability for the position."}, {"week": 11, "number": 14, "question": "An entry-level résumé should generally be limited to about one and a half typed pages \naccording to the lecture.", "options": ["True", "False"], "correct": [0], "explanation": "An entry-level candidate usually has limited professional experience, so the résumé \nshould be concise and focused on relevant education, skills, projects, achievements \nand experience. According to the lecture, about one and a half typed pages is the \nrecommended limit."}, {"week": 11, "number": 15, "question": "Preparing an interview file means that only academic certificates need to be collected.", "options": ["True", "False"], "correct": [1], "explanation": "An interview file should contain more than academic certificates. It can include \nimportant documents such as the résumé, certificates, experience documents, \nidentification and other relevant materials required for the interview."}, {"week": 12, "number": 1, "question": "A candidate writes the objective: \"A position allowing me to utilize my knowledge and \nexpertise in different areas.\" What is the main problem with this objective?", "options": ["It contains too many technical terms.", "It is overly generalized.", "It focuses too much on specific skills", "It is too closely related to the job."], "correct": [1], "explanation": "A good career objective should be specific and focused. Saying \"a position allowing \nme to utilize my knowledge and expertise in different areas\" is too broad because it \ncould apply to many different jobs. A better objective would mention the type of \nposition or field the candidate is interested in."}, {"week": 12, "number": 2, "question": "Why are action phrases useful in the employment experience section of a résumé?", "options": ["They make the résumé unnecessarily detailed.", "They highlight duties performed and help avoid understating qualifications.", "They replace educational qualifications.", "They provide contact information for references."], "correct": [1], "explanation": "Action phrases clearly show what you actually did in a job. They make your \nexperience stronger and help the employer understand your responsibilities and \nachievements."}, {"week": 12, "number": 3, "question": "Which combination represents factors that can bolster a candidate's confidence during \nan interview?", "options": ["Appearance only", "Vocal characteristics only", "Mannerisms only", "Appearance, vocal characteristics, and mannerisms"], "correct": [3], "explanation": "Confidence during an interview is communicated through several things. \nProfessional appearance, a clear and confident voice, and appropriate \nmannerisms/body language can all contribute to a positive impression. \nIt is therefore not only about how you look or only about how you speak."}, {"week": 12, "number": 4, "question": "A candidate maintains an audible and confident voice and uses appropriate intonation. \nWhich aspect of interview performance is being demonstrated?", "options": ["Vocal characteristics", "Appearance", "Clothing", "Written communication"], "correct": [0], "explanation": "Vocal characteristics include things such as volume, pitch, tone, pace and \nintonation. A candidate with an audible and confident voice demonstrates good \ncontrol over these vocal features."}, {"week": 12, "number": 5, "question": "An Interviewer asks: \"What would you do if a group of disgruntled employees wanted to \ndamage company property because of their unfulfilled demands?\" What type of question is \nthis?", "options": ["Closed question", "Leading question", "Hypothetical question", "Reflective question"], "correct": [2], "explanation": "A hypothetical question asks what you would do in a situation that may not actually \nhave happened. Interviewers use these questions to understand your judgment, \nproblem-solving ability and decision-making skills. \nExample: \n\"What would you do if your team missed an important deadline?\""}, {"week": 12, "number": 6, "question": "An interviewer asks, \"Don't you think our company is the best as far as reputation is \nconcerned?\" Which type of question does this represent?", "options": ["Open question", "Leading question", "Hypothetical question", "Probing question"], "correct": [1], "explanation": "A leading question is worded in a way that encourages or pushes the person toward \na particular answer. \nHere, \"Don't you think our company is the best?\" encourages the candidate to \nagree with the interviewer's opinion. \n\n  \nExample: \n\"You enjoyed working with our team, didn't you?\" \nThis also leads the person toward a particular answer."}, {"week": 12, "number": 7, "question": "Which situation best demonstrates Emotional Intelligence?", "options": ["Memorizing a large amount of academic information", "Understanding one's emotions and managing them effectively while interacting with \nothers", "Solving a mathematical equation quickly", "Recalling historical facts"], "correct": [1], "explanation": "Emotional Intelligence means understanding your own emotions, controlling them \nappropriately and understanding other people's emotions. It helps a person \ncommunicate and build relationships effectively. \nExample: \nIf someone criticizes you and you remain calm, understand your feelings and \nrespond respectfully, you are demonstrating emotional intelligence."}, {"week": 12, "number": 8, "question": "A person carefully observes a situation, asks relevant questions, examines \nrelationships, and remains open to criticism. Which concept does this most directly \ndemonstrate?", "options": ["Critical Thinking", "Self-regulation", "Motivation", "Social competence"], "correct": [0], "explanation": "Critical thinking means analyzing information carefully, asking relevant questions, \nexamining relationships between ideas and being willing to consider different \nviewpoints or criticism. \nA critical thinker does not simply accept information; they evaluate it before forming \na conclusion."}, {"week": 12, "number": 9, "question": "Which sentence correctly uses an indefinite pronoun with a singular verb?", "options": ["Everyone in both offices were recommended for promotion.", "Everyone in both offices was recommended for promotion.", "Everyone in both offices have been recommended for promotion.", "Everyone in both offices are recommended for promotion."], "correct": [1], "explanation": "Although everyone refers to many people, grammatically it is treated as a singular \npronoun. Therefore, it takes the singular verb was, not were."}, {"week": 12, "number": 10, "question": "Which sentence is written in the passive voice?", "options": ["Everyone knows about his tricks.", "We expect good news.", "The ministry has recommended his name for the award.", "Your complaints will be heard in time."], "correct": [3], "explanation": "In the passive voice, the focus is on the receiver of the action. \nIn \"Your complaints will be heard,\" the complaints receive the action of being heard. \nCompare: \nActive: The officer will hear your complaints. \nPassive: Your complaints will be heard by the officer."}, {"week": 12, "number": 11, "question": "A résumé should include the names and addresses of references so that employers \ncan contact them immediately.", "options": ["True", "False"], "correct": [1], "explanation": "A résumé generally does not need to contain the names and addresses of \nreferences. References can be provided separately when the employer requests \nthem. \nThis also keeps the résumé concise and avoids unnecessarily sharing another \nperson's contact details."}, {"week": 12, "number": 12, "question": "Silence and pauses are included among the paralinguistic features that a candidate \nshould be aware of during an interview.", "options": ["True", "False"], "correct": [0], "explanation": "Paralinguistic features are vocal elements that accompany spoken words, such as \npauses, silence, tone, pitch, volume and pace. Using an appropriate pause can \nmake speech clearer and give the speaker time to organize thoughts. \nExample: \nA short pause before answering a difficult interview question can make your \nresponse sound more thoughtful."}, {"week": 12, "number": 13, "question": "Questions concerning a candidate's strengths and weaknesses may arise during an \ninterview.", "options": ["True", "False"], "correct": [0], "explanation": "Questions such as \"What are your strengths?\" or \"What is one area you need to \nimprove?\" are common interview questions. They help the interviewer understand \nthe candidate's self-awareness, attitude and ability to improve. \nExample: \nA good answer about a weakness should also show how you are working to \nimprove it."}, {"week": 12, "number": 14, "question": "Conflict management, leadership, communication, and collaboration are not examples \nof social skills.", "options": ["True", "False"], "correct": [1], "explanation": "These are actually important social skills because they involve interacting effectively \nwith other people. Communication helps us exchange information, collaboration \nhelps us work together, leadership helps guide others, and conflict management \nhelps resolve disagreements."}, {"week": 12, "number": 15, "question": "Words ending in -s, such as politics and physics, always require plural verbs.", "options": ["True", "False"], "correct": [1], "explanation": "Not every word ending in -s is plural. Some subjects, such as politics, physics and \nmathematics, can be treated as singular subjects when referring to the academic \nsubject or field. \nExamples: \nPolitics is an important subject. \nhysics is difficult for some students. \nSo, simply seeing -s at the end of a word does not always mean that a plural verb is \nrequired."}];
let current = 0;
let started = false;
let checked = Array(questions.length).fill(false);
let selections = questions.map(q => []);
let score = 0;

function startTest(){
  started = true;
  document.getElementById('start').style.display='none';
  document.getElementById('quiz').style.display='block';
  render();
}

function isMulti(q){
  return q.correct.length > 1 || /select all that apply/i.test(q.question);
}

function render(){
  const q=questions[current];
  document.getElementById('counter').textContent=`Question ${current+1} / ${questions.length}`;
  document.getElementById('bar').style.width=`${((current+1)/questions.length)*100}%`;
  document.getElementById('meta').textContent=`Week ${q.week} • Question ${q.number}`;
  document.getElementById('question').textContent=q.question;
  document.getElementById('hint').textContent=isMulti(q) ? '☑ Select all correct answers' : '◉ Select one answer';
  const box=document.getElementById('options');
  box.innerHTML='';
  q.options.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='option';
    b.type='button';
    b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}.</span>${escapeHtml(opt)}`;
    b.onclick=()=>selectOption(i);
    box.appendChild(b);
  });
  const fb=document.getElementById('feedback');
  fb.className='feedback';
  fb.innerHTML='';
  document.getElementById('checkBtn').style.display=checked[current]?'none':'inline-block';
  document.getElementById('nextBtn').style.display=checked[current]?'inline-block':'none';
  document.getElementById('prevBtn').disabled=current===0;
  if(checked[current]) showChecked();
  else applySelectionVisuals();
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function selectOption(i){
  if(checked[current]) return;
  const q=questions[current];
  if(isMulti(q)){
    const a=selections[current];
    const p=a.indexOf(i);
    if(p>=0) a.splice(p,1); else a.push(i);
  } else {
    selections[current]=[i];
  }
  applySelectionVisuals();
}

function applySelectionVisuals(){
  [...document.querySelectorAll('.option')].forEach((b,i)=>b.classList.toggle('selected',selections[current].includes(i)));
}

function sameSet(a,b){
  if(a.length!==b.length) return false;
  const x=[...a].sort((m,n)=>m-n), y=[...b].sort((m,n)=>m-n);
  return x.every((v,i)=>v===y[i]);
}

function checkAnswer(){
  if(selections[current].length===0) return;
  const q=questions[current];
  const ok=sameSet(selections[current],q.correct);
  if(ok) score++;
  checked[current]=true;
  showChecked();
}

function showChecked(){
  const q=questions[current];
  const selected=selections[current];
  const ok=sameSet(selected,q.correct);
  document.querySelectorAll('.option').forEach((b,i)=>{
    b.disabled=true;
    b.classList.remove('selected');
    if(q.correct.includes(i)) b.classList.add('correct');
    if(selected.includes(i) && !q.correct.includes(i)) b.classList.add('wrong');
  });
  const fb=document.getElementById('feedback');
  fb.className='feedback show '+(ok?'ok':'no');
  const letters=q.correct.map(i=>String.fromCharCode(65+i)).join(', ');
  fb.innerHTML=`<strong>${ok?'✅ Correct!':'❌ Incorrect'}</strong><div>Correct answer: <b>${letters}</b></div><div class="explain">${escapeHtml(q.explanation)}</div>`;
  document.getElementById('checkBtn').style.display='none';
  document.getElementById('nextBtn').style.display='inline-block';
}

function nextQ(){
  if(current<questions.length-1){current++;render();window.scrollTo({top:0,behavior:'smooth'});}
  else finish();
}

function prevQ(){
  if(current>0){current--;render();window.scrollTo({top:0,behavior:'smooth'});}
}

function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('result').style.display='block';
  const pct=Math.round((score/questions.length)*100);
  document.getElementById('score').textContent=`${score} / ${questions.length}`;
  document.getElementById('percent').textContent=`${pct}%`;
  buildReview();
}

function buildReview(){
  const r=document.getElementById('review');
  r.innerHTML=questions.map((q,i)=>{
    const letters=q.correct.map(x=>String.fromCharCode(65+x)).join(', ');
    return `<div class="review-item"><strong>Q${i+1} — Week ${q.week}</strong>Answer: ${letters}</div>`;
  }).join('');
}

function toggleReview(){
  const r=document.getElementById('review');
  r.style.display=r.style.display==='none'?'grid':'none';
}

function restart(){
  current=0; score=0; checked=Array(questions.length).fill(false); selections=questions.map(q=>[]);
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  render();
}
</script>
</body>
</html>
